<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChoiceScript Analyser</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --border: #0f3460;
      --text: #e0e0e0;
      --accent: #e94560;
      --accent-dim: #c73e54;
      --success: #4ecca3;
      --warn: #f0a500;
      --muted: #888;
      --mono: "Consolas", "Menlo", monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }
    .source-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .tab-group {
      display: flex;
      gap: 0;
    }
    .tab-group button {
      border-radius: 0;
      border-right: none;
    }
    .tab-group button:first-child { border-radius: 3px 0 0 3px; }
    .tab-group button:last-child { border-radius: 0 3px 3px 0; border-right: 1px solid var(--border); }
    .tab-group button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .source-input { flex: 1; min-width: 200px; }
    #url-input {
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.6rem;
      font-family: var(--mono);
      font-size: 0.85rem;
      border-radius: 3px;
    }
    #url-input:focus { outline: none; border-color: var(--accent); }
    #url-input::placeholder { color: var(--muted); }
    .extras-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .extras-row label {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }
    #extra-scenes {
      flex: 1;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.6rem;
      font-family: var(--mono);
      font-size: 0.85rem;
      border-radius: 3px;
    }
    #extra-scenes:focus { outline: none; border-color: var(--accent); }
    #extra-scenes::placeholder { color: var(--muted); }
    .action-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    button, label.file-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      font-family: var(--mono);
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 3px;
    }
    button:hover, label.file-btn:hover { border-color: var(--accent); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover { background: var(--accent-dim); }
    input[type="file"] { display: none; }
    #status {
      font-size: 0.8rem;
      color: var(--muted);
      margin-left: auto;
    }
    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    #log-panel {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      font-size: 0.8rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-info { color: var(--text); }
    .log-warn { color: var(--warn); }
    .log-error { color: var(--accent); }
    .log-stage {
      color: var(--success);
      font-weight: bold;
      margin-top: 0.5em;
    }
    #results-panel {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      border-left: 1px solid var(--border);
      font-size: 0.85rem;
      line-height: 1.6;
    }
    #results-panel h2 {
      font-size: 0.95rem;
      color: var(--accent);
      margin: 1em 0 0.3em;
    }
    #results-panel h2:first-child { margin-top: 0; }
    #results-panel pre {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.5rem;
      overflow-x: auto;
      border-radius: 3px;
    }
    details { margin: 0.3em 0; }
    details summary { cursor: pointer; color: var(--muted); font-size: 0.8rem; }
    details summary:hover { color: var(--text); }
    .hidden { display: none; }
    .tab-group button.disabled { opacity: 0.4; cursor: not-allowed; }
    .opfs-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .opfs-table th { text-align: left; color: var(--muted); border-bottom: 1px solid var(--border); padding: 0.3em 0.6em; font-weight: normal; }
    .opfs-table td { padding: 0.25em 0.6em; }
    .col-name { }
    .col-size { width: 6em; text-align: right; color: var(--muted); }
    .col-actions { width: 7em; text-align: right; }
    .col-actions a { color: var(--accent); text-decoration: none; margin-left: 0.6em; }
    .col-actions a:hover { text-decoration: underline; }
    .dir-row { cursor: pointer; }
    .dir-row td { background: var(--surface); color: var(--success); font-weight: bold; padding: 0.35em 0.6em; border-top: 1px solid var(--border); }
    .dir-row .size { font-weight: normal; color: var(--muted); }
    .dir-toggle { color: var(--muted); margin-right: 0.3em; display: inline-block; width: 1em; }
    .dir-row:hover td { background: var(--border); }
    .file-row td { border-bottom: 1px solid rgba(15,52,96,0.3); }
    .file-row:hover td { background: rgba(15,52,96,0.4); }
    .file-row .col-name { padding-left: 2em; }
    .file-link { color: var(--text); text-decoration: none; }
    .file-link:hover { color: var(--accent); text-decoration: underline; }
    .md-view { line-height: 1.7; }
    .md-view h1, .md-view h2, .md-view h3, .md-view h4 { color: var(--accent); margin: 0.8em 0 0.3em; }
    .md-view h1 { font-size: 1.1rem; }
    .md-view h2 { font-size: 1rem; }
    .md-view h3 { font-size: 0.95rem; }
    .md-view p { margin: 0.4em 0; }
    .md-view ul { padding-left: 1.5em; margin: 0.3em 0; }
    .md-view li { margin: 0.15em 0; }
    .md-view code { background: var(--surface); padding: 0.1em 0.3em; border-radius: 2px; font-size: 0.9em; }
    .md-view pre { background: var(--surface); border: 1px solid var(--border); padding: 0.6em; border-radius: 3px; overflow-x: auto; margin: 0.5em 0; }
    .md-view pre code { background: none; padding: 0; }
    .md-view strong { color: var(--success); }
    .svg-view { background: #fff; border-radius: 3px; padding: 1em; margin-top: 0.5em; overflow: auto; }
    .svg-view svg { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <header>
    <h1>ChoiceScript Analyser</h1>
    <div class="source-row">
      <div class="tab-group">
        <button id="tab-saved" class="active disabled" data-mode="saved">Saved</button>
        <button id="tab-folder" data-mode="folder">Folder</button>
        <button id="tab-url" data-mode="url">URL</button>
      </div>
      <div class="source-input">
        <span id="saved-info">Checking OPFS…</span>
        <label class="file-btn hidden" id="folder-label">
          Select game folder
          <input type="file" id="folder-input" webkitdirectory />
        </label>
        <input type="text" id="url-input" class="hidden"
               placeholder="https://example.com/mygame" />
      </div>
    </div>
    <div class="extras-row">
      <label for="extra-scenes">Extra scenes:</label>
      <input type="text" id="extra-scenes"
             placeholder="scene1, scene2 (comma-separated, optional)" />
    </div>
    <div class="action-row">
      <button id="run-btn" class="primary" disabled>Analyse</button>
      <button id="clear-btn" class="hidden">Clear saved</button>
      <button id="browse-btn" class="hidden">Browse OPFS</button>
      <div id="status">No source selected</div>
    </div>
  </header>
  <main>
    <div id="log-panel"></div>
    <div id="results-panel"></div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
